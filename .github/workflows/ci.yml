name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run browser:ensure --prefix frontend
      - id: backend-tests
        continue-on-error: true
        run: python -m pytest -q --tb=short 2>&1 | Tee-Object -FilePath pytest.log
      - if: steps.backend-tests.outcome == 'failure'
        shell: pwsh
        run: |
          $tail = (Get-Content pytest.log -Tail 80) -join "`n"
          $message = $tail.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
          Write-Output "::error title=Backend tests failed::$message"
          exit 1
      - run: npm run test --prefix frontend
      - run: npm run build --prefix frontend
